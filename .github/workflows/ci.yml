name: Windows tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned test and build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Test synthetic workers, native state and exports
        run: python -m pytest -q --basetemp=.pytest-work -W error::pytest.PytestUnraisableExceptionWarning
      - name: Check Python source syntax
        run: python -m compileall -q hisser main.py scripts
